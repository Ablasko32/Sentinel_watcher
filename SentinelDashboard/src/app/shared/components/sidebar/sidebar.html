<div class="m-2 h-[calc(100vh-1rem)]">
  <nav
    class="py-4 px-3 bg-surface-200 dark:bg-surface-900 h-full flex flex-col border border-primary/10 shadow-md dark:border-primary/10 rounded-md"
  >
    <h2 class="mb-10 flex flex-col justify-center items-center">
      <img src="eye-horus.svg" alt="Sentinel Watcher Logo" class="w-8 h-8 inline-block" />
      <p class="text-center tracking-widest text-[8px] font-semibold dark:text-primary">Sentinel</p>
    </h2>
    <ul class="flex flex-col gap-4">
      @for (item of menuItems; track $index) {
        <li>
          <a
            [pTooltip]="item.label"
            showDelay="1000"
            routerLinkActive=" shadow-md border-2 border-primary/20"
            [routerLinkActiveOptions]="{ exact: true }"
            [routerLink]="item.route"
            [attr.aria-label]="item.label"
            class="w-full flex items-center justify-center p-2.5 rounded-md"
          >
            <i [class]="item.icon + ' dark:text-primary'"></i>
          </a>
        </li>
      }
    </ul>

    <div class="mt-auto flex gap-7 flex-col items-center justify-center">
      <app-theme-switch></app-theme-switch>
      <p-avatar class="cursor-pointer" (click)="op.toggle($event)" icon="pi pi-user" />
      <p-popover #op>
        <div class="flex flex-col items-start gap-2">
          <p class="font-medium">{{ authService.user()?.username }}</p>
          <p class="text-sm text-gray-500">{{ authService.user()?.email }}</p>
          <p-button
            size="small"
            [loading]="isLoading()"
            label="Logout"
            severity="danger"
            (click)="logout()"
            class="w-full mt-2"
          ></p-button>
        </div>
      </p-popover>
    </div>
  </nav>
</div>
