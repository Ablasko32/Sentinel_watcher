<h2 class="mb-4 text-muted-color flex items-center gap-2">
  <p>Manage your Team</p>
  <p-badge severity="info" size="small" [value]="pagination().totalCount"></p-badge>
</h2>
<!-- body -->
<div class="flex flex-col gap-2">
  <p-button (click)="show()" label="Add User" icon="pi pi-plus" size="small"></p-button>
  <p-table
    #dt
    sortField="username"
    [sortOrder]="0"
    [lazy]="true"
    (onLazyLoad)="onLazyLoad($event)"
    [paginator]="true"
    [rows]="5"
    [stripedRows]="true"
    [loading]="isLoading()"
    [value]="users()"
    [totalRecords]="pagination().totalCount"
    [globalFilterFields]="['username', 'email']"
    [filterDelay]="500"
  >
    <ng-template pTemplate="caption">
      <p-iconfield iconPosition="left">
        <p-inputicon>
          <i class="pi pi-search"></i>
        </p-inputicon>
        <input
          pInputText
          type="text"
          (input)="dt.filterGlobal($event.target.value, 'contains')"
          placeholder="Global Search"
        />
      </p-iconfield>
    </ng-template>
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="username">Username <p-sortIcon field="username"></p-sortIcon></th>
        <th pSortableColumn="email">Email <p-sortIcon field="email"></p-sortIcon></th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-user>
      <tr>
        <td class="capitalize">{{ user.username }}</td>
        <td>{{ user.email }}</td>
        <td class="text-end flex gap-2 justify-end">
          <p-button
            size="small"
            severity="danger"
            icon="pi pi-trash"
            (click)="confirmDelete(user)"
          ></p-button>
          <p-button
            size="small"
            severity="contrast"
            icon="pi pi-pencil"
            (click)="openEditDialog(user)"
          />
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
